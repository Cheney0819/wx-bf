name: 构建桌宠 Windows 安装包

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取桌宠版本
        id: app_version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "windows-pet-wpf\DesktopPet.Wpf.csproj"
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "未在 DesktopPet.Wpf.csproj 中读取到版本号"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 安装 FFmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: 安装 Pester
        shell: pwsh
        run: Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser

      - name: 检查远程发布范围
        shell: pwsh
        run: |
          $base = git rev-parse HEAD^
          & .github\workflows\verify-release-scope.ps1 -BaseSha $base -HeadSha HEAD

      - name: 安装 Python 构建依赖
        shell: pwsh
        run: python -m pip install -r windows-parser\requirements-build.txt

      - name: 运行后台和卸载器测试
        shell: pwsh
        run: |
          dotnet test windows-background\DesktopPet.Background.sln -c Release
          dotnet test tools\DesktopPet.Uninstaller.sln -c Release

      - name: 运行 Parser 测试
        shell: pwsh
        run: python -m pytest windows-parser\tests -q

      - name: 运行 PowerShell 契约测试
        shell: pwsh
        run: Invoke-Pester windows-pet-wpf\tests -Output Detailed

      - name: 构建统一发布目录
        shell: pwsh
        run: .\build.ps1 -Runtime win-x64

      - name: 验证发布目录
        shell: pwsh
        run: .\windows-pet-wpf\tests\validate-release.ps1 -PublishRoot .\windows-pet-wpf\bin\Release\net8.0-windows\win-x64\publish

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: 构建中文安装包
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows-pet-wpf\DesktopPetSetup.iss"'

      - name: 整理并检查产物
        shell: pwsh
        run: |
          $installer = "windows-pet-wpf\installer-output\桌宠-安装包.exe"
          $size = (Get-Item $installer).Length
          if ($size -gt 100MB) {
            Write-Host "安装包超过 100 MiB，输出最大文件：" -ForegroundColor Red
            Get-ChildItem "windows-pet-wpf\bin\Release\net8.0-windows\win-x64\publish" -File -Recurse |
              Sort-Object Length -Descending |
              Select-Object -First 10 FullName, Length |
              Format-Table -AutoSize
            throw "安装包过大：$size bytes"
          }

          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $installer "release\桌宠-$env:APP_VERSION-安装包.exe" -Force
          Copy-Item "windows-pet-wpf\bin\Release\net8.0-windows\win-x64\publish\release-manifest.json" `
            "release\桌宠-$env:APP_VERSION-release-manifest.json" -Force
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  桌宠-$env:APP_VERSION-安装包.exe" |
            Set-Content "release\桌宠-$env:APP_VERSION-sha256.txt" -Encoding utf8
          Write-Host "安装包大小：$size bytes"
          Write-Host "安装包 SHA-256：$hash"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 桌宠-${{ steps.app_version.outputs.version }}
          path: release\*
